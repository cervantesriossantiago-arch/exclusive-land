    :root {

      --gold-lt: #e8d08a;

      --bg:      #080c14;
      --bg2:     #0d1220;

      --text:    #e2e0db;
      --muted:   #8a8880;
      --white:   #f5f3ef;
      --sand:    #b98a5a;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      line-height: 1.7;
      overflow-x: hidden;

    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }

    /* ── Topbar ── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 48px;
      background: linear-gradient(to bottom, rgba(8,12,20,.92), transparent);
      backdrop-filter: blur(4px);

    .logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; letter-spacing: .1em; color: var(--white); }
    .logo span { color: var(--gold); }
    .logo-sub { display:block; font-size: 9px; letter-spacing: .3em; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
    .topbar-right { display: flex; align-items: center; gap: 20px; }
    .back-link {
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--muted); display: flex; align-items: center; gap: 8px;
      transition: color .2s;

    .back-link:hover { color: var(--gold); }
    .lang-switcher { display: flex; gap: 8px; }
    .lang-btn {
      background: none; border: 1px solid rgba(201,168,76,.3);
      color: var(--muted); font-size: 11px; letter-spacing: .1em;
      padding: 6px 12px; cursor: pointer; transition: all .2s;
      font-family: 'Montserrat', sans-serif;
    }
    .lang-btn:hover, .lang-btn.active { background: var(--gold); border-color: var(--gold); color: var(--bg); }

    /* ── Hero ── */
    .ba-hero {
      position: relative; height: 100vh; min-height: 640px;
      display: flex; align-items: center; justify-content: center;
      text-align: center; overflow: hidden;
    }
    .ba-hero-bg {
      position: absolute; inset: 0;
      background: url('imagenes/buenos-aires/foto1.jpg') center 60% / cover no-repeat;
    }
    .ba-hero-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(8,12,20,.55) 0%, rgba(8,12,20,.35) 40%, rgba(8,12,20,.85) 100%);
    }
    .ba-hero-content { position: relative; z-index: 2; padding: 0 24px; max-width: 900px; }
    .ba-eyebrow {
      font-size: 12px; letter-spacing: .35em; text-transform: uppercase;
      color: var(--gold-lt); margin-bottom: 22px;
    }
    .ba-hero h1 {
      font-family: 'Cormorant Garamond', serif; font-weight: 400;
      font-size: clamp(42px, 7vw, 84px); color: var(--white); line-height: 1.05;
      letter-spacing: .01em;
    }
    .ba-hero h1 em { font-style: italic; color: var(--gold); }
    .ba-hero-slogan {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: clamp(16px, 2vw, 22px); color: var(--gold-lt);
      letter-spacing: .05em; margin-top: 18px;
    }
    .ba-hero-divider { width: 70px; height: 1px; background: var(--gold); margin: 28px auto; }
    .ba-hero p.desc {
      font-size: 15px; color: var(--text); max-width: 620px; margin: 0 auto 34px;
      font-weight: 300;
    }
    .ba-hero-ctas { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .btn-gold, .btn-outline {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 15px 32px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
      transition: all .25s;
    }
    .btn-gold { background: var(--gold); color: var(--bg); }
    .btn-gold:hover { background: var(--gold-lt); transform: translateY(-2px); }
    .btn-outline { border: 1px solid rgba(201,168,76,.5); color: var(--gold-lt); }
    .btn-outline:hover { border-color: var(--gold); background: rgba(201,168,76,.08); }

    /* ── Stats bar ── */

      display: grid; grid-template-columns: repeat(4, 1fr);
      background: var(--bg2); border-top: 1px solid rgba(201,168,76,.12); border-bottom: 1px solid rgba(201,168,76,.12);
    }
    .ba-stat { text-align: center; padding: 36px 12px; border-right: 1px solid rgba(201,168,76,.08); }
    .ba-stat:last-child { border-right: none; }
    .ba-stat-num { font-family: 'Cormorant Garamond', serif; font-size: 34px; color: var(--gold); }
    .ba-stat-label { font-size: 10px; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }

    /* ── Sections generic ── */

    .section-eyebrow {

    .section-sub {

    /* ── About / descripción ── */
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; }
    .about-grid img { border-radius: 2px; }
    .about-text p { margin-bottom: 18px; color: var(--text); font-size: 14.5px; }
    .about-text strong { color: var(--gold-lt); font-weight: 500; }
    .feature-list { list-style: none; margin-top: 24px; }
    .feature-list li {
      display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px;
      font-size: 14px; color: var(--text);
    }
    .feature-list svg { flex-shrink: 0; margin-top: 3px; color: var(--gold); }

    /* ── Galería ── */
    .gallery-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    }
    .gallery-grid img {
      width: 100%; height: 220px; object-fit: cover; border-radius: 2px;
      cursor: pointer; transition: transform .3s, filter .3s;
      filter: brightness(.92);
    }
    .gallery-grid img:hover { transform: scale(1.02); filter: brightness(1.05); }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; background: rgba(5,7,12,.96); z-index: 999;
      display: none; align-items: center; justify-content: center; padding: 40px;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 92vw; max-height: 86vh; object-fit: contain; }
    .lightbox-close {
      position: absolute; top: 24px; right: 32px; font-size: 28px; color: var(--gold-lt);
      background: none; border: none; cursor: pointer;
    }
    .lightbox-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(201,168,76,.12); border: 1px solid rgba(201,168,76,.3);
      color: var(--gold-lt); width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px;
    }
    .lightbox-prev { left: 24px; } .lightbox-next { right: 24px; }

    /* ── Ubicación / mapa ── */
    .location-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: start; }
    .location-grid img { border: 1px solid rgba(201,168,76,.15); border-radius: 2px; background: #fff; }
    .location-facts { list-style: none; }
    .location-facts li {
      padding: 16px 0; border-bottom: 1px solid rgba(201,168,76,.1);
      display: flex; justify-content: space-between; font-size: 13.5px;
    }
    .location-facts li span:first-child { color: var(--muted); }
    .location-facts li span:last-child { color: var(--text); text-align: right; max-width: 60%; }

    /* ── Precios ── */
    .price-table-wrap { overflow-x: auto; }
    table.price-table {
      width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px;
    }
    table.price-table th {
      text-align: left; padding: 14px 16px; font-size: 10px; letter-spacing: .1em;
      text-transform: uppercase; color: var(--gold-lt); border-bottom: 1px solid rgba(201,168,76,.25);
    }
    table.price-table td {
      padding: 14px 16px; border-bottom: 1px solid rgba(201,168,76,.08); color: var(--text);
    }
    table.price-table tr:hover td { background: rgba(201,168,76,.04); }
    .price-table-note { font-size: 12px; color: var(--muted); margin-top: 18px; text-align: center; }

    .financing-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 50px; }
    .financing-card {
      background: var(--bg2); border: 1px solid rgba(201,168,76,.12);
      padding: 32px 28px; text-align: center;
    }
    .financing-card .fc-num { font-family: 'Cormorant Garamond', serif; font-size: 40px; color: var(--gold); }
    .financing-card .fc-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
    .financing-card .fc-desc { font-size: 12.5px; color: var(--text); margin-top: 14px; }

    /* ── Timeline preventa ── */
    .timeline { display: flex; flex-wrap: wrap; gap: 0; justify-content: center; margin-top: 50px; }
    .timeline-step {
      flex: 1; min-width: 220px; text-align: center; padding: 0 20px; position: relative;
    }
    .timeline-step:not(:last-child)::after {
      content: ''; position: absolute; top: 22px; right: -10%; width: 20%; height: 1px;
      background: rgba(201,168,76,.3);
    }
    .timeline-dot {
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--gold);
      display: flex; align-items: center; justify-content: center; margin: 0 auto 18px;
      font-family: 'Cormorant Garamond', serif; font-size: 18px; color: var(--gold);
    }
    .timeline-step h4 { font-size: 14px; color: var(--white); margin-bottom: 8px; font-weight: 500; }
    .timeline-step p { font-size: 12.5px; color: var(--muted); }

    /* ── CTA final ── */
    .final-cta {
      background: linear-gradient(rgba(8,12,20,.75), rgba(8,12,20,.9)), url('imagenes/buenos-aires/foto6.jpg') center / cover;
      padding: 110px 24px; text-align: center;
    }
    .final-cta h2 { font-family: 'Cormorant Garamond', serif; font-size: clamp(28px,4vw,44px); color: var(--white); margin-bottom: 18px; }
    .final-cta p { color: var(--muted); max-width: 520px; margin: 0 auto 36px; font-size: 14px; }

    /* ── Footer ── */
    footer {
      padding: 40px 24px; text-align: center; background: var(--bg2);
      border-top: 1px solid rgba(201,168,76,.1);
    }
    footer p { font-size: 12px; color: var(--muted); }
    footer a { color: var(--gold-lt); }

    @media (max-width: 860px) {
      .about-grid, .location-grid { grid-template-columns: 1fr; }
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
      .ba-stats { grid-template-columns: repeat(2, 1fr); }
      .financing-cards { grid-template-columns: 1fr; }
      .timeline { flex-direction: column; gap: 30px; }
      .timeline-step:not(:last-child)::after { display: none; }
      .topbar { padding: 18px 20px; }
      .section { padding: 70px 20px; }
    }
  </style>
</head>

    ];
    function fmt(n){ return '$' + n.toLocaleString('en-US'); }
    function renderPriceTable(){
      const body = document.getElementById('price-table-body');
      body.innerHTML = lotes.map(l => `
        <tr>
          <td>${l.m2.toLocaleString('en-US')} m²</td>
          <td>${fmt(l.contado)} MXN</td>
          <td>${fmt(l.enganche)}</td>
          <td>${fmt(l.mensual)}</td>
          <td>${fmt(l.anual)}</td>
        </tr>
      `).join('');
    }

    /* ── Lightbox ── */
    const galleryImgs = Array.from(document.querySelectorAll('#gallery img')).map(img => img.src);
    let currentImg = 0;
    function openLightbox(i){
      currentImg = i;
      document.getElementById('lightbox-img').src = galleryImgs[i];
      document.getElementById('lightbox').classList.add('active');
    }
    function closeLightbox(){ document.getElementById('lightbox').classList.remove('active'); }
    function navLightbox(dir){
      currentImg = (currentImg + dir + galleryImgs.length) % galleryImgs.length;
      document.getElementById('lightbox-img').src = galleryImgs[currentImg];
    }
    document.getElementById('lightbox').addEventListener('click', e=>{
      if(e.target.id === 'lightbox') closeLightbox();
    });

    setLang('es');
  </script>
